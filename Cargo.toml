[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.1"
authors = ["Rohit Kumar"]
repository = "https://github.com/rohitdevsol/cex"


[workspace]
members = [
    "apps/*",
    "crates/*"
]
resolver = "3"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# web framework
actix-web = "4"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# env/config
dotenvy = "0.15"

# config management
figment = { version = "0.10", features = ["toml", "env"] }

# database
sqlx = { version = "0.7", features = [
    "postgres",
    "uuid",
    "time",
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio-rustls"
] }

# ids + time
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json"
] }

# error handling
thiserror = "1"
anyhow = "1"
